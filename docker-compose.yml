version: '3.8'

services:
  networthy:
    build: .
    container_name: networthy-app
    ports:
      - "5000:5000"
    volumes:
      # Mount a volume for persistent data storage
      - ./data:/app/data
      # Mount the JSON file location
      - ./net_worth_history.json:/app/net_worth_history.json
    environment:
      - FLASK_APP=app.py
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
