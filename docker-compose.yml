version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: networthy-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-networthy}
      POSTGRES_USER: ${POSTGRES_USER:-networthy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-networthy}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"  # Expose for local development (remove in production)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-networthy}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Flask Application
  app:
    build: .
    container_name: networthy-app
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-networthy}:${POSTGRES_PASSWORD:-networthy}@db:5432/${POSTGRES_DB:-networthy}
      - FLASK_APP=app.py
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount static files for nginx to serve
      - ./static:/app/static:ro
      # Optional: mount templates for development
      - ./templates:/app/templates:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 5 &&
        echo 'Initializing database...' &&
        python -c 'from app import app, init_db; init_db()' &&
        echo 'Starting application...' &&
        gunicorn --bind 0.0.0.0:5000 --workers 2 --timeout 120 app:app
      "

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: networthy-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/app/static:ro
      # Optional: mount SSL certificates for HTTPS
      # - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: networthy-network
